name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get this repository's code
        uses: actions/checkout@v4
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.13.4"
          python-version: "3.12"
      - name: Run the same checks as on your Mac
        run: bash scripts/ci.sh
