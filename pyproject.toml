[project]
name = "risk-ci-lab"
version = "0.1.0"
description = "A tiny CI/CD learning lab: Python, Bash, GitHub Actions and Argo CD"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.13,<0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
